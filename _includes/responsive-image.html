{% assign responsive_image = site.data.responsive_images[include.image] %}
{% assign image_sizes = include.sizes | default: '100vw' %}
{% if responsive_image %}
  {% assign fallback_image = responsive_image.variants | first %}
  <picture>
    <source type="image/webp" srcset="{% for variant in responsive_image.variants %}{{ base_path }}/images/{{ variant.webp }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ image_sizes }}">
    <img src="{{ base_path }}/images/{{ fallback_image.jpeg }}" srcset="{% for variant in responsive_image.variants %}{{ base_path }}/images/{{ variant.jpeg }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ image_sizes }}" width="{{ responsive_image.width }}" height="{{ responsive_image.height }}" alt="{{ include.alt | default: '' | escape }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async"{% if include.class %} class="{{ include.class }}"{% endif %}{% if include.fetchpriority %} fetchpriority="{{ include.fetchpriority }}"{% endif %}>
  </picture>
{% else %}
  <img src="{% if include.image contains '://' %}{{ include.image }}{% else %}{{ base_path }}/images/{{ include.image }}{% endif %}" alt="{{ include.alt | default: '' | escape }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async"{% if include.class %} class="{{ include.class }}"{% endif %}{% if include.fetchpriority %} fetchpriority="{{ include.fetchpriority }}"{% endif %}>
{% endif %}
