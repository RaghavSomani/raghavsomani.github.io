{% if site.comments.disqus.shortname %}
  <script>
    (function () {
      var status = document.getElementById('disqus_status');
      var message = document.getElementById('disqus_message');
      var ready = false;

      function showError() {
        if (!ready) {
          message.textContent = 'Comments could not load. Check your connection or allow Disqus in your browser.';
        }
      }

      message.textContent = 'Loading comments…';
      var timeout = window.setTimeout(showError, 15000);

      window.disqus_config = function () {
        // Preserve URL-based thread identity for existing comments.
        this.page.url = {{ site.comments.disqus.site_url | default: site.url | append: site.baseurl | append: page.url | jsonify }};
        this.page.title = {{ page.title | strip_html | strip_newlines | jsonify }};
        this.callbacks.onReady = [function () {
          ready = true;
          window.clearTimeout(timeout);
          status.hidden = true;
        }];
      };

      var script = document.createElement('script');
      script.src = {{ 'https://' | append: site.comments.disqus.shortname | append: '.disqus.com/embed.js' | jsonify }};
      script.async = true;
      script.onerror = showError;
      script.setAttribute('data-timestamp', +new Date());
      (document.head || document.body).appendChild(script);
    }());
  </script>
{% endif %}
