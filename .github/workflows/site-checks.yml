name: Site checks and deployment

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Generate icon assets
        run: npm run build:icons

      - name: Build browser JavaScript
        run: npm run build:js

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build the site
        run: npm run build

      - name: Verify required output
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml

      - name: Check internal links and assets
        run: node scripts/check-internal-links.mjs _site

      - name: Validate generated HTML structure
        run: npm run check:html

      - name: Check lightbox security and compatibility
        run: npm run check:lightbox

      - name: Check accessibility and keyboard interactions
        run: npm run check:accessibility

      - name: Enforce profile-image budgets
        shell: bash
        run: |
          test "$(wc -c < images/profile-350.jpg)" -le 60000
          test "$(wc -c < images/profile-700.jpg)" -le 150000

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
